name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      installer_ref:
        description: Installer Git ref to test
        required: false
        default: main
      installer_url:
        description: Full installer URL to test
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-scenario:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint scripts
        run: |
          shellcheck scripts/run-scenario.sh
          shellcheck scripts/in-container-run.sh
          shellcheck scripts/lib/assertions.sh

      - name: Run default scenario
        env:
          SMU_PASS_HOST_ENV: true
          SMU_INSTALLER_REF: ${{ github.event.inputs.installer_ref || 'main' }}
          SMU_INSTALLER_URL: ${{ github.event.inputs.installer_url }}
        run: ./scripts/run-scenario.sh default

  dotfiles-scenario:
    runs-on: ubuntu-24.04
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [default-scenario]
    steps:
      - uses: actions/checkout@v5

      - name: Run dotfiles scenario
        env:
          SMU_PASS_HOST_ENV: true
          SMU_INSTALLER_REF: ${{ github.event.inputs.installer_ref || 'main' }}
          SMU_INSTALLER_URL: ${{ github.event.inputs.installer_url }}
        run: ./scripts/run-scenario.sh dotfiles

  vps-scenario:
    runs-on: ubuntu-24.04
    needs: [default-scenario]
    strategy:
      fail-fast: false
      matrix:
        scenario: [vps, vps-ubuntu, vps-debian]
    steps:
      - uses: actions/checkout@v5

      - name: Run headless VPS scenario
        env:
          SMU_PASS_HOST_ENV: true
          SMU_INSTALLER_REF: ${{ github.event.inputs.installer_ref || 'main' }}
          SMU_INSTALLER_URL: ${{ github.event.inputs.installer_url }}
        run: ./scripts/run-scenario.sh "${{ matrix.scenario }}"

  candidate-scenario:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [default-scenario]
    steps:
      - uses: actions/checkout@v5

      - name: Run candidate installer scenario
        env:
          SMU_PASS_HOST_ENV: true
          SMU_INSTALLER_REF: candidate
        run: ./scripts/run-scenario.sh default

  dotfiles-macos:
    runs-on: macos-15
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [default-scenario]
    steps:
      - uses: actions/checkout@v5

      - name: Run dotfiles scenario (native macOS)
        env:
          SMU_INSTALLER_REF: ${{ github.event.inputs.installer_ref || 'main' }}
          SMU_INSTALLER_URL: ${{ github.event.inputs.installer_url }}
        run: ./scripts/run-scenario.sh --native dotfiles-macos

  flox-smoke-test:
    name: Flox manifest smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Flox
        uses: flox/install-flox-action@v2.5.3

      - name: Verify pinned toolchain activates
        run: |
          flox activate -- bash -c '
            set -euo pipefail
            echo "Toolchain versions inside flox activate:"
            bash --version | head -1
            shellcheck --version | head -3
            echo "Linting harness scripts with the pinned shellcheck:"
            shellcheck scripts/run-scenario.sh
            shellcheck scripts/in-container-run.sh
            shellcheck scripts/lib/assertions.sh
          '
